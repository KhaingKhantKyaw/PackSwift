<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Your Profile — PackSwift</title><link rel="stylesheet" href="/css/styles.css"><link rel="stylesheet" href="/css/profile-dashboard.css"><script src="/js/app.js" defer></script><script src="/js/profile.js" defer></script><link rel="stylesheet" href="/css/planning-support.css"><script src="/js/planning-model.js" defer></script><script src="/js/profile-personality.js" defer></script></head><body data-page="profile"><header class="site-header"><div class="header-inner"><a class="brand" href="/">◇ PackSwift</a><nav class="desktop-nav" aria-label="Primary navigation"></nav><a class="header-action" href="/login">Login</a></div></header><main class="profile-shell"><div class="profile-heading"><div><h1>Your Profile</h1></div></div><p id="profile-status" role="status">Loading profile…</p><section id="profile-guest" hidden><a href="/login">Log in to manage your profile</a></section><div id="profile-content" hidden><section class="identity-bar"><div class="profile-avatar" id="profile-initials"></div><div><h2 id="profile-name"></h2></div><div class="identity-actions"><button id="edit-profile" type="button">✎ Edit profile</button><a class="profile-trips-button" href="/trips">My Trips <span aria-hidden="true">→</span></a></div></section><form id="profile-form"><div class="profile-panels" id="profile-panels"></div><footer class="profile-save-bar"><button class="save-primary" type="submit">Save changes</button></footer><p id="save-feedback" role="status"></p></form><section class="account-bar"><h2>Account &amp; privacy</h2><details><summary>Sign-in &amp; security</summary><form id="password-form"><label>Current password<input name="currentPassword" type="password" required autocomplete="current-password"></label><label>New password<input name="newPassword" type="password" minlength="10" maxlength="128" required autocomplete="new-password"></label><p>At
